<div class="content">
    <div class="row">
        <div class="col-12">
            <div class="post-builder">
                <div class="profile-pic">
                    <img width="50" height="50" [src]="this.imageUrl ? this.imageUrl : 'assets/images/user.png'" style="background-size:auto 100%;" class="profile-pic"  alt="">
                </div>
                <button mat-button (click)="openPostDialog()" class="write-smth">What's on your mind, {{this.currentUser?.firstname}}?</button>
                <button mat-button (click)="openPhotoDialog()" class="add-post-photo"><img src="assets/images/photos-icon.png" width="30px" height="30px"> Photo</button>
            </div>
            <div class="post text-center">
                No posts yet
            </div>
        </div>
    </div>
</div>
