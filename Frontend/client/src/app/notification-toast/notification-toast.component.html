<div class="notification-toast">
      <img [src]="image ? image : 'assets/images/user.png'" alt="avatar" class="avatar" />
      <div class="content">
        <p class="name">{{notification.senderFirstname}} {{notification.senderLastname}}</p>
        <p class="message">{{notification.message}}</p>
      </div>
    </div>
